name: Build Kalahari Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host prep
        run: bash scripts/00-host-prep.sh

      - name: Build cross toolchain
        run: bash scripts/01-toolchain.sh

      - name: Build temporary system
        run: bash scripts/02-tempsystem.sh

      - name: Enter chroot & build final system, dinit, kernel, kpk, branding
        run: sudo bash scripts/03-chroot-enter.sh

      - name: Build ISO image
        run: sudo bash scripts/09-image.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalahari-linux-iso
          path: output/*.iso
