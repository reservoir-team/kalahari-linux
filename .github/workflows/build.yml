name: Build Kalahari Linux

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git meson ninja-build \
            xz-utils cpio unzip rsync wget curl \
            util-linux fdisk dosfstools e2fsprogs mtools

      - name: Install xbstrap
        run: sudo pip install --break-system-packages xbstrap

      - name: Install y4
        run: sudo pip install --break-system-packages git+https://github.com/managarm/y4.git

      - name: Install xbps-static
        run: |
          wget http://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          mkdir -p $HOME/xbps
          tar xvf xbps-static-latest.x86_64-musl.tar.xz -C $HOME/xbps
          echo "$HOME/xbps/usr/bin" >> $GITHUB_PATH

      - name: Clone bootstrap-managarm
        run: git clone https://github.com/managarm/bootstrap-managarm.git build

      - name: Download Managarm buildenv
        working-directory: build
        run: |
          curl https://repos.managarm.org/buildenv/managarm-buildenv.tar.gz -o managarm-rootfs.tar.gz
          tar xvf managarm-rootfs.tar.gz

      - name: Create bootstrap-site.yml
        working-directory: build
        run: |
          cat > bootstrap-site.yml << 'SITEEOF'
          auto_pull: true
          pkg_management:
            format: xbps
            container:
              runtime: cbuildrt
              rootfs: managarm-rootfs
              uid: 1000
              gid: 1000
          src_mount: /var/lib/managarm-buildenv/src
          build_mount: /var/lib/managarm-buildenv/build
          allow_containerless: true
          define_options:
            mount-using: 'loopback'
          SITEEOF
          cat bootstrap-site.yml

      - name: xbstrap init
        working-directory: build
        run: xbstrap init .

      - name: xbstrap install-tool (bootstrap toolchain)
        working-directory: build
        run: xbstrap install-tool --all
        timeout-minutes: 300

      - name: xbstrap install core packages (kernel, mlibc)
        working-directory: build
        run: xbstrap install --all managarm-kernel mlibc
        timeout-minutes: 300

      - name: xbstrap install managarm-system
        working-directory: build
        run: xbstrap install --all managarm-system
        timeout-minutes: 300

      - name: Inject Kalahari Linux customizations
        working-directory: build
        run: |
          mkdir -p extrafiles/usr/local/bin
          mkdir -p "extrafiles/usr/share/kalahari"
          cp $GITHUB_WORKSPACE/kpk/kpk extrafiles/usr/local/bin/kpk
          chmod +x extrafiles/usr/local/bin/kpk
          cp -r $GITHUB_WORKSPACE/fastfetch extrafiles/usr/share/kalahari/fastfetch
          cp -r $GITHUB_WORKSPACE/assets extrafiles/usr/share/kalahari/assets
          ls -la extrafiles/usr/local/bin/
          ls -la extrafiles/usr/share/kalahari/

      - name: xbstrap initialize-empty-image
        working-directory: build
        run: sudo env PATH="/usr/local/bin:$PATH:/usr/sbin" xbstrap run initialize-empty-image
        timeout-minutes: 30

      - name: xbstrap run make-image
        working-directory: build
        run: sudo env PATH="/usr/local/bin:$PATH:/usr/sbin" xbstrap run make-image
        timeout-minutes: 60

      - name: List build output
        working-directory: build
        run: |
          echo "=== Searching for image files ==="
          sudo find . -maxdepth 2 -type f | grep -v "^\./rootfs" | grep -v "^\./system-root" || true
          echo "=== bootstrap.yml image-related config ==="
          grep -ri "image" bootstrap-site.yml || true

      - name: Upload disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalahari-linux-image
          path: build/image
          if-no-files-found: warn
