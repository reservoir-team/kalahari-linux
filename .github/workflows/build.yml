name: Build Kalahari Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host prep
        run: bash scripts/00-host-prep.sh

      - name: Build cross toolchain
        run: bash scripts/01-toolchain.sh

      - name: Create rootfs skeleton
        run: bash scripts/03-chroot-enter.sh

      - name: Build final system
        run: bash scripts/04-final-system.sh

      - name: Dump config.log on failure (debug)
        if: failure()
        run: |
          find "$HOME/lfs/sources" -name "config.log" -newer "$HOME/lfs/sources/wget-list" -exec sh -c 'echo "=== {} ==="; tail -50 "{}"' \;

      - name: Build and integrate dinit
        run: bash scripts/05-dinit.sh

      - name: Build kernel
        run: bash scripts/06-kernel.sh

      - name: Integrate kpk
        run: bash scripts/07-kpk-integrate.sh

      - name: Apply branding
        run: bash scripts/08-branding.sh

      - name: Build ISO image
        run: bash scripts/09-image.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalahari-linux-iso
          path: output/*.iso
